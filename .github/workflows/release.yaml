name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15.2"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e esp32dev

      # Credentials live in NVS, never in the image, so the binary is safe to publish.
      - name: Attach firmware to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: .pio/build/esp32dev/firmware.bin
          generate_release_notes: true
