[env:esp32dev]
platform = espressif32@^8.0.0 ; renovate: datasource=github-tags depName=platformio/platform-espressif32
board = esp32dev
; Two 1.9 MB OTA slots: Arduino-ESP32 3.x outgrew the default 1.25 MB. Same NVS offset, no filesystem in use.
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
    knolleary/PubSubClient@^2.8 ; renovate: datasource=github-tags depName=knolleary/pubsubclient
    bblanchon/ArduinoJson@^7.4.3 ; renovate: datasource=github-tags depName=bblanchon/ArduinoJson
    tzapu/WiFiManager@^2.0.17 ; renovate: datasource=github-tags depName=tzapu/WiFiManager
